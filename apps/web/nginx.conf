# Cloudflared is the only ingress to this container. Keep this source range
# aligned with the Docker network if the deployment topology changes.
set_real_ip_from 172.16.0.0/12;
real_ip_header CF-Connecting-IP;
real_ip_recursive off;

server {
  listen 80;
  server_name _;
  server_tokens off;
  client_max_body_size 1m;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  add_header Strict-Transport-Security "max-age=15552000" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  root /usr/share/nginx/html;
  index index.html;

  location = /api {
    return 308 /api/;
  }

  location /api/ {
    proxy_pass http://api:4101/;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
